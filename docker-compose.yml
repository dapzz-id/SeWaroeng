version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sewaroeng_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sewaroeng_db
      POSTGRES_USER: sewaroeng_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sewaroeng_secret}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewaroeng_user -d sewaroeng_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sewaroeng_network

  redis:
    image: redis:7.2-alpine
    container_name: sewaroeng_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-sewaroeng_redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-sewaroeng_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sewaroeng_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sewaroeng_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - sewaroeng_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sewaroeng_network:
    driver: bridge
    name: sewaroeng_network
