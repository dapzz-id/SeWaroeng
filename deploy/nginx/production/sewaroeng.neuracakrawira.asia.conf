# ==============================================================================
# SeWaroeng — Production Flutter Web Nginx Virtual Host
# Host:   sewaroeng.neuracakrawira.asia
# Target: Ubuntu 22.04+ LTS / Debian 12+
# Root:   /var/www/sewaroeng/frontend/build/web
# ==============================================================================
# STATUS: PLANNED PRODUCTION TARGET — INACTIVE TEMPLATE
# DO NOT ENABLE OR INSTALL UNTIL AUTHORIZED PRODUCTION DEPLOYMENT.
# DNS and TLS certificates for this hostname have NOT been provisioned yet.
# ==============================================================================

# HTTP — Phase 1 Bootstrap & ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name sewaroeng.neuracakrawira.asia;

    root /var/www/sewaroeng/frontend/build/web;
    index index.html;

    # Let's Encrypt HTTP-01 Challenge Pass-through
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sewaroeng/frontend/build/web;
    }

    # Security: Deny direct access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Flutter SPA Client-Side Routing: fallback to index.html for unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entrypoint & Service Worker: NEVER cache to ensure clients receive immediate updates
    location ~* (index\.html|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Static Assets & Font Bundles: Cache immutably for 1 year
    location ~* \.(?:css|js|woff2?|ttf|eot|wasm|png|jpe?g|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    access_log /var/log/nginx/sewaroeng.neuracakrawira.asia_access.log;
    error_log /var/log/nginx/sewaroeng.neuracakrawira.asia_error.log warn;
}

