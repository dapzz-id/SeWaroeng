# ==============================================================================
# SeWaroeng — Production Backend API Nginx Virtual Host
# Host:   api.sewaroeng.neuracakrawira.asia
# Target: Ubuntu 22.04+ LTS / Debian 12+, PHP 8.4-FPM
# Root:   /var/www/sewaroeng/backend/public
# ==============================================================================
# STATUS: PLANNED PRODUCTION TARGET — INACTIVE TEMPLATE
# DO NOT ENABLE OR INSTALL UNTIL AUTHORIZED PRODUCTION DEPLOYMENT.
# DNS and TLS certificates for this hostname have NOT been provisioned yet.
# ==============================================================================

# HTTP — Phase 1 Bootstrap & ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name api.sewaroeng.neuracakrawira.asia;

    root /var/www/sewaroeng/backend/public;
    index index.php;

    # Security: Deny direct access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Let's Encrypt HTTP-01 Challenge Pass-through
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/sewaroeng/backend/public;
    }

    # API Routing & Proxy to PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health & Liveness probes (Unauthenticated, fast response)
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location = /api/v1/health {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM execution
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Webhook payload & signature preservation (Midtrans, Duitku, Meta WhatsApp)
        fastcgi_pass_request_headers on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 10s;
    }

    client_max_body_size 16M;

    access_log /var/log/nginx/api.sewaroeng.neuracakrawira.asia_access.log;
    error_log /var/log/nginx/api.sewaroeng.neuracakrawira.asia_error.log warn;
}

