name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend (Laravel 13 & PHP 8.4)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sewaroeng_test
          POSTGRES_USER: sewaroeng_app
          POSTGRES_PASSWORD: sewaroeng_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, redis
          coverage: none

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code formatting (Pint)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Configure PostgreSQL Role Privileges
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=sewaroeng_password psql -h 127.0.0.1 -U sewaroeng_app -d sewaroeng_test -c "ALTER ROLE sewaroeng_app WITH NOSUPERUSER NOBYPASSRLS;"

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env

      - name: Generate App Key
        working-directory: backend
        run: php artisan key:generate

      - name: Run Database Migrations
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sewaroeng_test
          DB_USERNAME: sewaroeng_app
          DB_PASSWORD: sewaroeng_password
        run: php artisan migrate --force

      - name: Run Backend Tests
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sewaroeng_test
          DB_USERNAME: sewaroeng_app
          DB_PASSWORD: sewaroeng_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test

  frontend:
    name: Frontend (Flutter & Drift)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Check code formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

      - name: Verify Flutter Web Staging Build
        working-directory: frontend
        run: flutter build web --release --dart-define=APP_ENV=staging --dart-define=API_BASE_URL=https://staging-api.example.internal/api/v1

  hygiene-and-deployment-readiness:
    name: Repository Hygiene & Deployment Toolkit Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for accidentally tracked environment files or private keys
        run: |
          TRACKED_ENV=$(git ls-files | grep -iE '\.env$' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "::error::Accidentally tracked environment file detected: $TRACKED_ENV"
            exit 1
          fi

          TRACKED_SECRETS=$(git ls-files | grep -iE '\.(key|pem|p12|dump)$' || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "::error::Accidentally tracked private key or dump detected: $TRACKED_SECRETS"
            exit 1
          fi

      - name: Validate Deployment Shell Scripts Syntax (bash -n)
        run: |
          bash -n deploy/preflight.sh
          bash -n deploy/deploy-staging.sh
          bash -n deploy/validate-domains.sh
          bash -n deploy/render-nginx-config.sh

      - name: Verify Deployment Artifacts Exist and Are Non-Empty
        run: |
          test -s deploy/systemd/sewaroeng-worker.service
          test -s deploy/systemd/sewaroeng-scheduler.service
          test -s deploy/systemd/sewaroeng-scheduler.timer
          test -s deploy/nginx/templates/api.conf.template
          test -s deploy/nginx/templates/web.conf.template
          test -s deploy/nginx/production/api.sewaroeng.neuracakrawira.asia.conf
          test -s deploy/nginx/production/sewaroeng.neuracakrawira.asia.conf
          test -s scripts/setup-db-staging.sql
          test -s scripts/setup-db-dev.sql
          test -s scripts/setup-db-production.sql

      - name: Validate Domain Configuration Logic and Nginx Template Rendering
        run: |
          bash deploy/validate-domains.sh --mode staging --api-host staging-api.example.internal --web-host staging.example.internal --flutter-api-url https://staging-api.example.internal/api/v1
          bash deploy/validate-domains.sh --mode production --api-host api.sewaroeng.neuracakrawira.asia --web-host sewaroeng.neuracakrawira.asia --flutter-api-url https://api.sewaroeng.neuracakrawira.asia/api/v1
          bash deploy/render-nginx-config.sh --dry-run --api-host staging-api.example.internal --web-host staging.example.internal
