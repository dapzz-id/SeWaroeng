name: sewaroeng
description: SeWaroeng — Marketplace UMKM by Neura Cakrawira Solusi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^14.0.0

  # ── State Management ───────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Network ────────────────────────────────────────────────────────────────
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # ── Local Storage ──────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # ── UI ─────────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # ── Utils ──────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.3.1
  uuid: ^4.4.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  mobile_scanner: ^7.2.0
  pdf: ^3.13.0
  printing: ^5.15.0
  fl_chart: ^1.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ────────────────────────────────────────────────────────
  build_runner: ^2.4.11
  riverpod_generator: 2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # ── Testing ────────────────────────────────────────────────────────────────
  mockito: ^5.4.4
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
